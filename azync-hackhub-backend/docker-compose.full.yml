name: azync-hackhub

services:
  postgres:
    image: postgres:16-alpine
    container_name: azync-hackhub-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-azync_hackhub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - hackhub-network

  redis:
    image: redis:7-alpine
    container_name: azync-hackhub-redis
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - hackhub-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azync-hackhub-backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-azync_hackhub}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_DATA_ENCRYPTION_KEY: ${AI_DATA_ENCRYPTION_KEY:?AI_DATA_ENCRYPTION_KEY must be set}
      AI_DATA_ENCRYPTION_KEY_VERSION: ${AI_DATA_ENCRYPTION_KEY_VERSION:-v1}
      AI_DATA_ENCRYPTION_MIGRATE_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        echo "Waiting for PostgreSQL..."
        until pg_isready -h postgres -p 5432 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-azync_hackhub}"; do
          sleep 2
        done
        npx prisma migrate deploy
        if [ -f prisma/seed.ts ]; then
          npx prisma db seed
        fi
        exec node dist/src/main.js
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://localhost:3001/api > /dev/null || exit 1]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - hackhub-network
      - hackhub-egress

networks:
  hackhub-network:
    driver: bridge
    internal: true
  hackhub-egress:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
