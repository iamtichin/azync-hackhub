services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: azync_e2e
      POSTGRES_PASSWORD: azync_e2e
      POSTGRES_DB: azync_hackhub_e2e
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - azync-hackhub-e2e-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azync_e2e -d azync_hackhub_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - azync-hackhub-e2e-redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  azync-hackhub-e2e-postgres:
  azync-hackhub-e2e-redis:
