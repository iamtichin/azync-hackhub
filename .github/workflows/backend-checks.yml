name: Application checks

on:
  pull_request:
    paths:
      - "azync-hackhub-backend/**"
      - "frontend/**"
      - ".github/workflows/backend-checks.yml"
  push:
    branches: [main]
    paths:
      - "azync-hackhub-backend/**"
      - "frontend/**"
      - ".github/workflows/backend-checks.yml"

# This workflow deliberately runs untrusted pull-request code without write
# permissions or repository secrets. Never replace pull_request with
# pull_request_target for participant repositories.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azync-hackhub-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: azync-hackhub-backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:e2e:ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
